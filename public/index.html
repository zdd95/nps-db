<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPS Survey Data</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>NPS Survey Data</h1>
            <button onclick="resetAllFilters()" class="reset-all-btn">Сбросить все</button>
        </div>
        
        <div class="form-row">
            <!-- Фильтр: Проект -->
            <div class="filter-group">
                <label for="projectsDropdown">Проект:</label>
                <div class="dropdown">
                    <input type="text"
                           id="projectsDropdown"
                           class="dropdown-input"
                           placeholder="Загрузка проектов..."
                           readonly
                           onclick="toggleProjectDropdown()">
                    <div class="dropdown-list" id="projectList">
                        <div class="search-container">
                            <input type="text"
                                id="projectSearch"
                                class="search-input"
                                placeholder="Поиск проекта..."
                                oninput="filterProjects()">
                        </div>
                        <div class="dropdown-options" id="projectOptions"></div>
                    </div>
                </div>
            </div>
            
            <!-- Фильтр: Домен -->
            <div class="filter-group">
                <label for="domainFilter">Домен:</label>
                <div class="dropdown">
                    <input type="text"
                           id="domainFilter"
                           class="dropdown-input"
                           placeholder="Выберите проект"
                           readonly
                           onclick="toggleDomainDropdown()">
                    <div class="dropdown-list" id="domainList">
                        <div class="search-container">
                            <input type="text"
                                id="domainSearch"
                                class="search-input"
                                placeholder="Поиск домена..."
                                oninput="filterDomains()">
                        </div>
                        <div class="dropdown-options" id="domainOptions"></div>
                    </div>
                </div>
            </div>
            
            <!-- Фильтр: Выберите ID кампании -->
            <div class="filter-group">
                <label for="campaignFilter">ID кампании:</label>
                <div class="dropdown">
                    <input type="text"
                           id="campaignFilter"
                           class="dropdown-input"
                           placeholder="Выберите домен"
                           readonly
                           onclick="toggleCampaignDropdown()">
                    <div class="dropdown-list" id="campaignList">
                        <div class="search-container">
                            <input type="text"
                                id="campaignSearch"
                                class="search-input"
                                placeholder="Поиск campaign..."
                                oninput="filterCampaigns()">
                        </div>
                        <div class="dropdown-options" id="campaignOptions">
                            <div class="checkbox-controls">
                                <button type="button" onclick="selectAllCampaigns()" class="select-all-btn">Выбрать все</button>
                                <button type="button" onclick="deselectAllCampaigns()" class="deselect-all-btn">Сбросить все</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Фильтр: Диапазон дат -->
            <div class="date-filters-inline">
                <div class="filter-group">
                    <label for="dateFromFilter">Дата с:</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="dateFromFilter">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="dateToFilter">Дата по:</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="dateToFilter">
                    </div>
                </div>
            </div>
        </div>

        <div class="buttons-group">
            <button onclick="loadData()">Загрузить данные с БД</button>
            <button onclick="downloadCSV()" id="downloadBtn" disabled>Скачать CSV</button>
            <button onclick="openAnalysisModal()" id="analyzeBtn" disabled>Анализ данных</button>
        </div>
        
        <div id="message"></div>
        <div id="loading" class="loading" style="display: none;">Загрузка данных...</div>
        
        <div id="tableContainer" style="margin-top: 20px;"></div>
        <div id="paginationContainer" class="pagination" style="display: none;">
            <div class="pagination-left">
                <label for="pageSizeSelect">Показывать по:</label>
                <select id="pageSizeSelect">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
                <span id="totalCount" class="total-count"></span>
            </div>
            <div class="pagination-right">
                <button id="firstPageBtn" class="page-btn" title="Первая">«</button>
                <button id="prevPageBtn" class="page-btn" title="Назад">‹</button>
                <span id="pageInfo" class="page-info">Страница 1 из 1</span>
                <button id="nextPageBtn" class="page-btn" title="Вперёд">›</button>
                <button id="lastPageBtn" class="page-btn" title="Последняя">»</button>
            </div>
        </div>
    </div>

    <!-- Analysis Modal -->
    <div id="analysisModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="analysisTitle">
            <div class="modal-header">
                <h2 id="analysisTitle">Отчет анализа данных</h2>
                <button class="modal-close" id="analysisCloseBtn" aria-label="Закрыть">✕</button>
            </div>
            <div class="modal-body" id="analysisBody"></div>
            <div class="modal-footer hidden" id="analysisFooter">
                <button class="modal-action" id="analysisDownloadBtn" type="button">Скачать CSV</button>
                <button class="modal-action" id="analysisDownloadExcelBtn" type="button">Скачать XLSX</button>
            </div>
        </div>
    </div>

    <template id="combinedAnalysisTemplate">
        <div class="analysis-header">
            <div class="analysis-title"><strong>Проект:</strong> <span data-role="project"></span></div>
            <div class="analysis-title"><strong>Домен:</strong> <span data-role="domain"></span></div>
            <div class="analysis-title"><strong>Данные за период:</strong> <span data-role="period"></span></div>
        </div>
        <div class="analysis-section-block">
            <h3 class="analysis-block-title">Общая сводка</h3>
            <div class="analysis-table-wrap">
                <table class="analysis-metrics-table">
                    <thead>
                        <tr>
                            <th>Кампания</th>
                            <th>Ответов</th>
                            <th>promoter (9-10)</th>
                            <th>passiv (7-8)</th>
                            <th>critic (0-6)</th>
                            <th>Score (ср.)</th>
                            <th>NPS, %</th>
                        </tr>
                    </thead>
                    <tbody data-role="metricsRows"></tbody>
                </table>
            </div>
            <div class="formula" data-role="defaultFormula"></div>
        </div>
        <div class="analysis-section-block">
            <h3 class="analysis-block-title">Стат. значимость</h3>
            <div class="analysis-table-wrap">
                <table class="analysis-significance-table">
                    <thead>
                        <tr>
                            <th>Кампания</th>
                            <th>Среднее</th>
                            <th>Мода</th>
                            <th>Ст. отклонение</th>
                            <th>NPS, %</th>
                            <th>CI нижняя, %</th>
                            <th>CI верхняя, %</th>
                            <th>Ошибка, %</th>
                            <th>Точность</th>
                            <th>Ответов дано</th>
                            <th>Ответов надо</th>
                            <th>Осталось ответов</th>
                        </tr>
                    </thead>
                    <tbody data-role="egorRows"></tbody>
                </table>
            </div>
            <div class="summary-box">
                <div class="summary-title"><strong>Пояснение к таблице «Стат. значимость»</strong></div>
                <div class="muted">
                    Расчет адаптирован под данные сервиса и выполняется по <strong>campaign_id</strong>, так как API не возвращает поле <strong>site</strong> из исходного расчета в Google Colab.
                </div>
                <div class="analysis-source-note">
                    За основу расчета был взят скрипт из Google Colab:
                    <a
                        href="https://colab.research.google.com/drive/188ZOx09HFZUgqLGaQsOVRvovlhuscQWx?usp=sharing#scrollTo=pPSYLk7VmmIN"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        открыть Colab
                    </a>
                </div>
                <div class="formula" data-role="egorFormula"></div>
                <ul class="analysis-notes-list">
                    <li><strong>Promoters</strong> — это оценки 9-10.</li>
                    <li><strong>Detractors</strong> — это оценки 0-6.</li>
                    <li><strong>SE</strong> — стандартная ошибка, показывает статистическую неопределенность результата.</li>
                    <li><strong>Z</strong> — коэффициент доверительного интервала; в этом отчете используется значение 1.96, что соответствует доверительной вероятности около 95%.</li>
                    <li><strong>Целевая ошибка</strong> — это допустимая погрешность результата; в текущем расчете она задана как 5%.</li>
                </ul>
            </div>
        </div>
        <div class="top-comments" data-role="commentsSection">
            <h3 class="top-comments__title">ТОП‑5 комментариев</h3>
            <table class="comments-table">
                <thead>
                    <tr>
                        <th>Кампания</th>
                        <th>Категория</th>
                        <th>Score</th>
                        <th>Email</th>
                        <th>Комментарий</th>
                    </tr>
                </thead>
                <tbody data-role="commentsRows"></tbody>
            </table>
        </div>
    </template>

    <template id="egorAnalysisRowTemplate">
        <tr>
            <td data-role="label"></td>
            <td data-role="mean"></td>
            <td data-role="mode"></td>
            <td data-role="stdDev"></td>
            <td data-role="nps"></td>
            <td data-role="ciLower"></td>
            <td data-role="ciUpper"></td>
            <td data-role="error"></td>
            <td data-role="precisionOk"></td>
            <td data-role="responsesGiven"></td>
            <td data-role="responsesRequired"></td>
            <td data-role="responsesRemaining"></td>
        </tr>
    </template>

    <template id="defaultAnalysisMetricsRowTemplate">
        <tr>
            <td data-role="label"></td>
            <td data-role="responses"></td>
            <td data-role="promoter"></td>
            <td data-role="passiv"></td>
            <td data-role="critic"></td>
            <td data-role="averageScore"></td>
            <td data-role="nps"></td>
        </tr>
    </template>

    <template id="defaultAnalysisCommentRowTemplate">
        <tr>
            <td data-role="campaignId"></td>
            <td data-role="category"></td>
            <td data-role="score"></td>
            <td data-role="email"></td>
            <td class="comment-text" data-role="text"></td>
        </tr>
    </template>

    <script src="vendor/xlsx.full.min.js"></script>
    <script src="script.js"></script>
    <div class="scroll-fab">
        <button id="scrollUpBtn" class="fab-btn" title="Наверх">▲</button>
        <button id="scrollDownBtn" class="fab-btn" title="Вниз">▼</button>
    </div>
</body>
</html>
